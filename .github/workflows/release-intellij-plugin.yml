# The IntelliJ plugin's release, independent of Microscope's (release.yml, tag-driven).
# It runs only by hand: Actions -> Release IntelliJ Plugin -> Run workflow.
#
# The version is read from gradle.properties (pluginVersion) by default; an optional input
# overrides it (useful for a beta tag that should not change gradle.properties on master).
#
# It builds the plugin zip (Gradle buildPlugin, Java 21), creates a GitHub release tagged
# intellij-plugin-v<version> with --latest=false, and attaches the distribution zip. The
# --latest=false keeps it from becoming GitHub's "latest" release: that designation belongs
# to Microscope, whose update check (GitHubReleaseChecker) reads /releases/latest.
#
# The plugin is also published to JetBrains Marketplace separately; this release provides
# a direct download and records the version for the jeffrey-pages version banner.

name: Release IntelliJ Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (default: read from gradle.properties). With or without leading v.'
        required: false
        type: string

jobs:
  version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.VERSION }}
    steps:
    - uses: actions/checkout@v6

    - name: Resolve version
      id: resolve
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "${INPUT_VERSION}" ]; then
          VERSION="${INPUT_VERSION#v}"
        else
          VERSION=$(grep '^pluginVersion = ' jeffrey-intellij-plugin/gradle.properties | cut -d' ' -f3)
          echo "Read version from gradle.properties: ${VERSION}"
        fi

        if [ -z "${VERSION}" ]; then
          echo "ERROR: could not resolve the plugin version" >&2
          exit 1
        fi

        if [[ ! "${VERSION}" =~ ^([0-9]+\.[0-9]+-b[0-9]+|[0-9]+\.[0-9]+\.[0-9]+(-[a-z][a-z0-9-]*)?)$ ]]; then
          echo "ERROR: version '${VERSION}' does not match [0-9]+.[0-9]+-b[0-9]+ or [0-9]+.[0-9]+.[0-9]+(-<suffix>)? where suffix is -bN or -[a-z][a-z0-9-]*" >&2
          exit 1
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "Releasing IntelliJ Plugin ${VERSION}"

  build:
    needs: [version]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jeffrey-intellij-plugin
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    - name: Set version
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: sed -i "s/^pluginVersion = .*/pluginVersion = ${VERSION}/" gradle.properties

    - name: Build plugin
      run: ./gradlew buildPlugin

    - uses: actions/upload-artifact@v7
      with:
        name: intellij-plugin-dist
        path: jeffrey-intellij-plugin/build/distributions/*.zip
        if-no-files-found: error
        retention-days: 1

  create-release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v8
      with:
        name: intellij-plugin-dist
        path: ${{ runner.temp }}/dist

    - name: Create tag and GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        TAG="intellij-plugin-v${VERSION}"

        if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
          echo "Tag ${TAG} already exists, keeping it as it is."
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"
        fi

        PRERELEASE_FLAG=""
        if [[ "${VERSION}" =~ -[a-z] ]]; then
          PRERELEASE_FLAG="--prerelease"
        fi

        gh release create "${TAG}" \
          ${RUNNER_TEMP}/dist/*.zip \
          --title "IntelliJ Plugin ${VERSION}" \
          --notes "JetBrains Marketplace: [Jeffrey Microscope](https://plugins.jetbrains.com/plugin/31963-jeffrey-microscope)" \
          --latest=false \
          ${PRERELEASE_FLAG}
