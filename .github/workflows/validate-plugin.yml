# The repository root doubles as a plugin marketplace for two ecosystems: users run
# `/plugin marketplace add petrbouda/jeffrey` in Claude Code, which reads
# .claude-plugin/marketplace.json, or `codex plugin marketplace add petrbouda/jeffrey`
# in Codex, which reads .agents/plugins/marketplace.json. Both are read straight off the
# default branch, and there is no release step in between, so a malformed manifest on
# master breaks every install and update the moment it lands. This job is that missing
# gate - the Claude Code half through the validator the docs tell plugin authors to run,
# the portable Agent Plugins half through the checks in build/scripts.
name: Validate MCP Plugin

on:
  push:
    branches:
      - master
    paths:
      - '.claude-plugin/**'
      - '.agents/plugins/**'
      - 'jeffrey-claude-plugin/**'
      - 'build/scripts/validate-agent-plugin.py'
      - 'build/scripts/check-plugin-references.py'
      - 'build/scripts/render-plugin.py'
      - 'build/scripts/test-status-hook.py'
      - 'build/plugin/**'
      - 'build/mcp/tools-list.snapshot.json'
      - '.github/workflows/validate-plugin.yml'
  pull_request:
    paths:
      - '.claude-plugin/**'
      - '.agents/plugins/**'
      - 'jeffrey-claude-plugin/**'
      - 'build/scripts/validate-agent-plugin.py'
      - 'build/scripts/check-plugin-references.py'
      - 'build/scripts/render-plugin.py'
      - 'build/scripts/test-status-hook.py'
      - 'build/plugin/**'
      - 'build/mcp/tools-list.snapshot.json'
      - '.github/workflows/validate-plugin.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Install Claude Code CLI
      run: npm install -g @anthropic-ai/claude-code

    # Checks JSON syntax, duplicate plugin names, source path traversal, and that the
    # version on the marketplace entry matches the one in the plugin's own manifest.
    - name: Validate the marketplace manifest
      run: claude plugin validate .

    # --strict turns warnings (unrecognised fields, typos in field names) into failures.
    - name: Validate the microscope plugin
      run: claude plugin validate ./jeffrey-claude-plugin --strict

    # The Agent Plugins manifest and MCP configuration Codex and the other portable
    # clients read, the skills both halves share, and the version agreement across all
    # four manifests. Also checks each skill carries usable front matter - the Claude
    # validator does not look inside skills, and one missing its front matter loads as
    # an unnamed no-op.
    - name: Validate the Agent Plugins manifest
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
        python3 build/scripts/validate-agent-plugin.py .

    # Every tool, argument, response field and enum value the skills, agents and README
    # name, held to the tools/list snapshot CI pins against the packaged jar - and every
    # MCP entry an agent lists a real tool or a whole server, since Claude Code drops a
    # family wildcard as unrecognized. The self-test proves each check still fires.
    - name: Check what the plugin names against the server
      run: |
        python3 build/scripts/check-plugin-references.py --self-test
        python3 build/scripts/check-plugin-references.py .

    # The skills' shared sections and the three dialects of every agent are rendered from
    # build/plugin/; a hand edit to a rendered file, or a source edit nobody rendered, fails.
    - name: Check the rendered plugin files against their sources
      run: python3 build/scripts/render-plugin.py . --check

    # The SessionStart hook runs in every session of every repository the plugin is installed for:
    # silent outside a JVM project and when Jeffrey answers, one valid message for each way the
    # tools are about to fail. Against a local stand-in for Jeffrey; needs bash and curl.
    - name: Test the SessionStart hook
      run: python3 build/scripts/test-status-hook.py
