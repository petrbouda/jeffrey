name: Build Native Provisioner

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without the leading v (e.g. 0.13.22). Resolved by the caller from the tag or from the manually entered version.'
        required: true
        type: string

jobs:
  build-provisioner-native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
    - uses: actions/checkout@v6

    - name: Setup GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm-community'

    - name: Build native provisioner
      env:
        JEFFREY_TAG_VERSION: ${{ inputs.version }}
      run: mvn -e -pl build/build-provisioner-native -am -Pnative package -DskipTests

    - name: Upload native provisioner
      uses: actions/upload-artifact@v7
      with:
        name: provisioner-${{ matrix.arch }}
        path: ./build/build-provisioner-native/target/provisioner
