# Microscope's release: push a tag vX.Y.Z[-bN|-suffix] and the version comes from the tag.
# The provisioner and the Volume Scheduler are released on their own, by hand, through
# release-provisioner.yml and release-volume-scheduler.yml respectively; their tags
# (provisioner-v<version>, volume-scheduler-v<version>) never match the patterns below.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+-b[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

name: Release Jeffrey Microscope

jobs:
  # Single source of the release version for every job and reusable workflow below, taken
  # from the tag and checked against the same patterns.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.VERSION }}
    steps:
    - name: Resolve version
      id: resolve
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        if [[ ! "${VERSION}" =~ ^([0-9]+\.[0-9]+-b[0-9]+|[0-9]+\.[0-9]+\.[0-9]+(-[a-z][a-z0-9-]*)?)$ ]]; then
          echo "ERROR: version '${VERSION}' does not match [0-9]+.[0-9]+-b[0-9]+ or [0-9]+.[0-9]+.[0-9]+(-<suffix>)? where suffix is -bN or -[a-z][a-z0-9-]*" >&2
          exit 1
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "Releasing version ${VERSION}"

  # The same toolchain Validate Backend and Validate Frontend run on: Temurin 25 and Maven for
  # the reactor, Node 24 (npm 11) for Microscope's frontend, which Maven builds through npm.
  build:
    needs: [version]
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: maven

    - uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Build with Maven
      env:
        JEFFREY_TAG_VERSION: ${{ needs.version.outputs.version }}
      run: mvn clean verify

    - name: Upload microscope.jar
      uses: actions/upload-artifact@v7
      with:
        name: microscope-jar
        path: ./build/build-microscope/target/microscope.jar

  microscope-runtime:
    needs: [version, build]
    uses: ./.github/workflows/release-microscope-runtime.yml
    with:
      version: ${{ needs.version.outputs.version }}

  create-release:
    needs: [version, build, microscope-runtime]
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download microscope.jar
      uses: actions/download-artifact@v8
      with:
        name: microscope-jar
        path: ./artifacts

    - name: Download runtime archive (linux-amd64)
      uses: actions/download-artifact@v8
      with:
        name: microscope-linux-amd64
        path: ./artifacts/runtimes

    - name: Download runtime archive (macos-arm64)
      uses: actions/download-artifact@v8
      with:
        name: microscope-macos-arm64
        path: ./artifacts/runtimes

    - name: Download runtime archive (windows-amd64)
      uses: actions/download-artifact@v8
      with:
        name: microscope-windows-amd64
        path: ./artifacts/runtimes

    - name: Prepare release assets
      run: |
        mv ./artifacts/runtimes/* ./artifacts/
        rm -rf ./artifacts/runtimes

    - name: Create Release
      uses: jreleaser/release-action@v2
      with:
        arguments: full-release
      env:
        JRELEASER_PROJECT_VERSION: ${{ needs.version.outputs.version }}
        JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
        JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

    - name: Upload JReleaser logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: jreleaser-release-output
        path: |
          out/jreleaser/trace.log
          out/jreleaser/output.properties
