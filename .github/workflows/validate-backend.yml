name: Validate Backend

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: Hub
            module: jeffrey-hub/core-hub
            phase: test
          - component: Microscope
            module: jeffrey-microscope/core-microscope
            phase: test
          - component: Provisioner
            module: build/build-provisioner
            phase: verify
          # Not reachable from Hub or Microscope: the heartbeat library is a dependency of the
          # applications Jeffrey profiles, not of Jeffrey itself, so nothing else builds it.
          - component: Heartbeat
            module: utilities/jeffrey-heartbeat-parent/jeffrey-heartbeat-spring-boot-starter
            phase: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install protobuf documentation tools
        if: matrix.component == 'Hub'
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler golang-go
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # exec.skip skips frontend builds and the Maven documentation generator together.
      # Generate the JSON explicitly so Hub's documentation endpoint is exercised too.
      - name: Generate protobuf documentation
        if: matrix.component == 'Hub'
        run: |
          mkdir -p shared/hub-api/target/classes
          protoc --doc_out=shared/hub-api/target/classes --doc_opt=json,grpc-api-docs.json \
            -Ishared/hub-api/src/main/proto shared/hub-api/src/main/proto/jeffrey/hub/api/v1/*.proto

      # Frontend-tagged HTTP checks run in Validate Frontend with the real Vite builds.
      - name: Validate ${{ matrix.component }} and its dependencies
        run: >-
          mvn --batch-mode --no-transfer-progress
          -pl ${{ matrix.module }} -am ${{ matrix.phase }}
          -Dexec.skip=true
          -DexcludedGroups=frontend

      - name: Check packaged Provisioner starts
        if: matrix.component == 'Provisioner'
        run: java -jar build/build-provisioner/target/provisioner.jar --help

      - name: Check plugin contracts against backend defaults
        if: matrix.component == 'Microscope'
        run: python3 build/scripts/validate-agent-plugin.py .

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.component }}-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
