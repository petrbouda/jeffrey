# The JIB extension's full release (Actions -> Release JIB Extension -> Run workflow).
# jeffrey-jib releases on its own cadence, independently of the main tag-triggered Jeffrey
# release (release.yml) and of the utility libraries (release-utilities.yml).
#
# Maven stages every module (the extensions, core, and the payload and flavour modules behind the
# `payload` profile) into a local staging repository; JReleaser signs them and uploads to Maven Central.
# A GitHub release tagged jib-v<version> is then created with --latest=false so the jeffrey-pages
# version banner can discover it via the Releases API without affecting Microscope's "latest" release.

name: Release JIB Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.11.0 or 0.11.0-b5). Must follow [0-9]+.[0-9]+.[0-9]+(-b[0-9]+)?'
        required: true
        type: string
      provisionerTag:
        description: 'Provisioner release tag: "latest" or a tag such as provisioner-v0.15.0.'
        required: false
        default: 'latest'
        type: string

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.VERSION }}
    steps:
    - name: Resolve version
      id: resolve
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        VERSION="${INPUT_VERSION#v}"
        if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-b[0-9]+)?$ ]]; then
          echo "ERROR: version '${VERSION}' does not match [0-9]+.[0-9]+.[0-9]+(-b[0-9]+)?" >&2
          exit 1
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "Releasing JIB Extension ${VERSION}"

  publish:
    needs: [version]
    runs-on: ubuntu-latest
    outputs:
      provisioner-tag: ${{ steps.jeffrey.outputs.RELEASE }}
      async-profiler-version: ${{ steps.ap-version.outputs.VERSION }}
    env:
      # The payload and flavour modules live behind the `payload` profile, so every Maven
      # invocation activates it — otherwise versions:set would leave them at 1.0-SNAPSHOT and
      # deploy would skip them. One deploy builds every module exactly once.
      MAVEN_PROFILES: release,payload
    defaults:
      run:
        working-directory: jeffrey-jib
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      # The payload modules ship the provisioner and async-profiler that jeffrey-jib bakes into
      # application images. The provisioner comes from a published provisioner release
      # (release-provisioner.yml) rather than from a Microscope release or a build of this
      # repository, because jeffrey-jib releases on its own cadence: which provisioner release
      # an extension carries is a choice, stated here (or defaulted to the latest provisioner
      # release), recorded in each payload jar's descriptor (jeffrey-payload/payload.properties)
      # and printed by the extension at build time. Consumers pick it up by the version of the
      # flavour they declare.
      - name: Resolve the provisioner release to bundle
        id: jeffrey
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE: ${{ inputs.provisionerTag }}
        run: |
          if [ -n "${INPUT_RELEASE}" ] && [ "${INPUT_RELEASE}" != "latest" ]; then
            RELEASE="${INPUT_RELEASE}"
          else
            # Find the latest provisioner release (provisioner-v* tags, non-draft, non-prerelease).
            RELEASE=$(gh release list -R petrbouda/jeffrey --json tagName,isDraft,isPrerelease \
              --jq '[.[] | select(.tagName | startswith("provisioner-v")) | select(.isDraft == false) | select(.isPrerelease == false)][0].tagName')
          fi
          if [[ ! "${RELEASE}" =~ ^provisioner-v[0-9] ]]; then
            echo "ERROR: could not resolve a provisioner release tag (got '${RELEASE}')" >&2
            exit 1
          fi
          echo "Bundling the provisioner from ${RELEASE}"
          echo "RELEASE=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Stage provisioner payloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.jeffrey.outputs.RELEASE }}" -R petrbouda/jeffrey \
            -p provisioner-amd64 -p provisioner-arm64 -p provisioner.jar -D /tmp/payload
          install -Dm644 /tmp/payload/provisioner-amd64 \
            jeffrey-jib-payload-native/src/main/payload/jeffrey-payload/provisioner-linux-amd64
          install -Dm644 /tmp/payload/provisioner-arm64 \
            jeffrey-jib-payload-native/src/main/payload/jeffrey-payload/provisioner-linux-arm64
          install -Dm644 /tmp/payload/provisioner.jar \
            jeffrey-jib-payload-jar/src/main/payload/jeffrey-payload/provisioner.jar

      # async-profiler is pinned by the async-profiler.version property in the jeffrey-jib pom; the
      # script fails on a missing release rather than staging an empty download.
      - name: Stage async-profiler payloads
        run: ../build/scripts/stage-async-profiler-payload.sh .

      - name: Resolve async-profiler version
        id: ap-version
        run: |
          VERSION=$(grep '<async-profiler.version>' pom.xml | sed 's/.*>\(.*\)<.*/\1/')
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "async-profiler ${VERSION}"

      - name: Set version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: mvn versions:set -DnewVersion=${VERSION} -DprocessAllModules=true -P ${{ env.MAVEN_PROFILES }}

      - name: Stage artifacts into local staging repository
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mvn -P ${{ env.MAVEN_PROFILES }} --batch-mode deploy -DskipTests \
            -Djeffrey.release=${{ steps.jeffrey.outputs.RELEASE }} \
            -DaltDeploymentRepository=local::file:$PWD/target/staging-deploy

      - name: Sign and deploy to Maven Central with JReleaser
        uses: jreleaser/release-action@v2
        with:
          arguments: deploy
          working-directory: jeffrey-jib
        env:
          JRELEASER_PROJECT_VERSION: ${{ needs.version.outputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-deploy-output-jeffrey-jib
          path: |
            jeffrey-jib/out/jreleaser/trace.log
            jeffrey-jib/out/jreleaser/output.properties

  create-release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Create tag and GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.version.outputs.version }}
        PROVISIONER_TAG: ${{ needs.publish.outputs.provisioner-tag }}
        AP_VERSION: ${{ needs.publish.outputs.async-profiler-version }}
      run: |
        TAG="jib-v${VERSION}"

        if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
          echo "Tag ${TAG} already exists, keeping it as it is."
        else
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"
        fi

        PRERELEASE_FLAG=""
        if [[ "${VERSION}" =~ -[a-z] ]]; then
          PRERELEASE_FLAG="--prerelease"
        fi

        NOTES=$(cat <<EOF
### Maven Central

**Gradle** — \`cafe.jeffrey-analyst:jeffrey-jib-gradle:${VERSION}\`
**Maven** — \`cafe.jeffrey-analyst:jeffrey-jib-maven:${VERSION}\`

Provisioner: \`${PROVISIONER_TAG}\`
async-profiler: \`${AP_VERSION}\`
EOF
        )

        gh release create "${TAG}" \
          --title "JIB Extension ${VERSION}" \
          --notes "${NOTES}" \
          --latest=false \
          ${PRERELEASE_FLAG}
