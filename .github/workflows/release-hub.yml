name: Docker Server Image (Jib)

on:
  workflow_call:

jobs:
  docker-server:
    runs-on: ubuntu-latest
    container:
      image: petrbouda/jeffrey-builder:25

    steps:
    - uses: actions/checkout@v6

    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    # The jeffrey-jib extension bakes the provisioner and async-profiler into the hub image from the
    # jeffrey-jib-payload-* artifacts. Those are built here, in this reactor, from THIS release's
    # own provisioner.jar (uploaded by the build job) and the async-profiler pinned in
    # utilities/jeffrey-jib/pom.xml — so the hub image never depends on a jeffrey-jib release
    # having been published to Maven Central first, and always self-profiles with the provisioner
    # it shipped with. The hub image uses provisionerSource=jar, so the native payload module
    # (which would need the GraalVM binaries) is not built.
    - name: Stage this release's provisioner.jar as the jar payload
      uses: actions/download-artifact@v8
      with:
        name: provisioner-jar
        path: ./utilities/jeffrey-jib/jeffrey-jib-payload-jar/src/main/resources/jeffrey-payload

    - name: Stage async-profiler payloads
      run: ./build/scripts/stage-async-profiler-payload.sh ./utilities/jeffrey-jib

    # Two-step: jib: prefix goal can only be invoked at the project level, so we install
    # the reactor up to build-hub-jib first, then run jib:build scoped to that module.
    - name: Install reactor up to build-hub-jib
      env:
        JEFFREY_TAG_VERSION: ${{ steps.version.outputs.VERSION }}
      run: mvn -pl build/build-hub-jib -am -DskipTests=true install

    # The payload modules live behind the `payload` profile and are not part of the reactor above.
    # -am pulls in their parent pom; jeffrey.release is recorded in each payload's manifest.
    - name: Install the payload artifacts the hub image bakes
      env:
        JEFFREY_TAG_VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        mvn -P payload \
          -pl utilities/jeffrey-jib/jeffrey-jib-payload-jar,utilities/jeffrey-jib/jeffrey-jib-payload-profiler -am \
          -DskipTests=true -Djeffrey.release=v${{ steps.version.outputs.VERSION }} install

    # docker/login-action shells out to `docker login`; the petrbouda/jeffrey-builder:25
    # container has no docker CLI, so we write ~/.docker/config.json directly. Jib reads it
    # automatically and Docker Hub accepts the same auth scheme docker login produces.
    - name: Configure Docker Hub auth for Jib
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        mkdir -p ~/.docker
        AUTH=$(printf '%s' "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')
        printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}\n' "${AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json

    - name: Build & push image with Jib
      run: |
        mvn -pl build/build-hub-jib compile jib:build \
          -Djib.to.image=petrbouda/jeffrey-hub:${{ steps.version.outputs.VERSION }} \
          -Djib.to.tags=latest
