name: Docker Server Image (Jib)

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without the leading v (e.g. 0.13.22). Resolved by the caller from the tag or from the manually entered version.'
        required: true
        type: string

jobs:
  docker-server:
    runs-on: ubuntu-latest
    container:
      image: petrbouda/jeffrey-builder:25

    steps:
    - uses: actions/checkout@v6

    # The hub image is built with the jar flavour of the jeffrey-jib extension
    # (jeffrey-jib-maven-jar), which bakes the provisioner jar and async-profiler from the
    # jeffrey-jib-payload-jar artifact. That payload is built here, in this reactor, from THIS
    # release's own provisioner.jar (uploaded by the build job) and the async-profiler pinned in
    # jeffrey-jib/pom.xml — so the hub image never depends on a jeffrey-jib release
    # having been published to Maven Central first, and always self-profiles with the provisioner
    # it shipped with. The native flavour (which would need the GraalVM binaries) is not built.
    - name: Stage this release's provisioner.jar as the jar payload
      uses: actions/download-artifact@v8
      with:
        name: provisioner-jar
        path: ./jeffrey-jib/jeffrey-jib-payload-jar/src/main/payload/jeffrey-payload

    - name: Stage async-profiler payloads
      run: ./build/scripts/stage-async-profiler-payload.sh ./jeffrey-jib

    # Two-step: jib: prefix goal can only be invoked at the project level, so we install
    # the reactor up to build-hub-jib first, then run jib:build scoped to that module.
    - name: Install reactor up to build-hub-jib
      env:
        JEFFREY_TAG_VERSION: ${{ inputs.version }}
      run: mvn -pl build/build-hub-jib -am -DskipTests=true install

    # The flavour and payload modules live behind the `payload` profile and are not part of the
    # reactor above. -am pulls in the extension, core and parent; jeffrey.release is recorded in
    # the payload's descriptor.
    - name: Install the jeffrey-jib flavour the hub image is built with
      env:
        JEFFREY_TAG_VERSION: ${{ inputs.version }}
      run: |
        mvn -P payload \
          -pl jeffrey-jib/jeffrey-jib-maven-jar -am \
          -DskipTests=true -Djeffrey.release=v${{ inputs.version }} install

    # docker/login-action shells out to `docker login`; the petrbouda/jeffrey-builder:25
    # container has no docker CLI, so we write ~/.docker/config.json directly. Jib reads it
    # automatically and Docker Hub accepts the same auth scheme docker login produces.
    - name: Configure Docker Hub auth for Jib
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        mkdir -p ~/.docker
        AUTH=$(printf '%s' "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" | base64 | tr -d '\n')
        printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}\n' "${AUTH}" > ~/.docker/config.json
        chmod 600 ~/.docker/config.json

    - name: Build & push image with Jib
      run: |
        mvn -pl build/build-hub-jib compile jib:build \
          -Djib.to.image=petrbouda/jeffrey-hub:${{ inputs.version }} \
          -Djib.to.tags=latest
