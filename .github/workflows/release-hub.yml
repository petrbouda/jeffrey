name: Docker Server Image (Native)

# Jeffrey Hub's image: a GraalVM native image, petrbouda/jeffrey-hub:<version> (and latest).
# There is no JVM image of the hub; it does not profile itself (async-profiler is a JVM agent).
#
# native-image does not cross-compile, and compiling under qemu takes most of an hour, so each
# architecture is built on its own runner, pushed by digest only, and the merge job joins the two
# digests under the release's tags.

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without the leading v (e.g. 0.13.22). Resolved by the caller from the tag or from the manually entered version.'
        required: true
        type: string

env:
  IMAGE: petrbouda/jeffrey-hub

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
    - uses: actions/checkout@v6

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile-hub
        platforms: linux/${{ matrix.arch }}
        build-args: |
          JEFFREY_TAG_VERSION=${{ inputs.version }}
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=hub-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=hub-${{ matrix.arch }}

    - name: Export digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p "${RUNNER_TEMP}/digests"
        touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

    - uses: actions/upload-artifact@v7
      with:
        name: hub-digest-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: hub-digest-*
        path: ${{ runner.temp }}/digests
        merge-multiple: true

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # `latest` follows plain X.Y.Z releases only; betas and suffixed builds (e.g. 0.14.5-hub-db-less)
    # must not move it.
    - name: Create the multi-arch manifest
      working-directory: ${{ runner.temp }}/digests
      env:
        VERSION: ${{ inputs.version }}
      run: |
        TAGS=(-t "${IMAGE}:${VERSION}")
        if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          TAGS+=(-t "${IMAGE}:latest")
        fi
        docker buildx imagetools create "${TAGS[@]}" $(printf "${IMAGE}@sha256:%s " *)
        docker buildx imagetools inspect "${IMAGE}:${VERSION}"
