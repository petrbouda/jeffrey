# THROWAWAY — Phase 0 spike for the Jeffrey MCP -> Spring AI 2.1.0 migration.
# Builds the standalone mcp-spike/ app on Java 25 and checks that Spring AI's modern
# (stateless 2026-07-28) MCP server, driven by a custom McpSyncToolRepository with
# hand-built CLOSED ($ref-free) schemas, serves: server/discover, a closed-schema tool,
# an input_required (elicitation) result, and SSE notifications/progress. The official
# conformance suite runs informationally (its fixture-tool checks fail for any real
# server; what we read is its wire-schema-valid verdict). Delete this workflow and
# mcp-spike/ once the migration proper lands.
name: MCP Spike (Phase 0)

on:
  push:
    branches: [ccr-4ee96f33-yyqg40]
  workflow_dispatch:

permissions:
  contents: read

env:
  URL: http://localhost:8585/api/mcp

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the spike
        run: mvn -B --no-transfer-progress -f mcp-spike/pom.xml package

      - name: Start the spike
        run: |
          java -jar mcp-spike/target/jeffrey-mcp-spike-0.0.1-SNAPSHOT.jar \
            --server.port=8585 > "${RUNNER_TEMP}/spike.log" 2>&1 &
          echo "spike_pid=$!" >> "${GITHUB_ENV}"

      - name: Wait for server/discover
        run: |
          req='{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"spike-ci","version":"1.0.0"}}}}'
          out="${RUNNER_TEMP}/discover.json"
          for _ in $(seq 1 60); do
            if ! kill -0 "${spike_pid}" 2>/dev/null; then
              echo "Spike exited before answering:"; cat "${RUNNER_TEMP}/spike.log"; exit 1
            fi
            code=$(curl -s --max-time 5 -o "$out" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: server/discover' \
              -d "$req" "$URL" 2>/dev/null || true)
            if [ "$code" = "200" ] && grep -q '"supportedVersions"' "$out"; then
              echo "Modern server is up:"; cat "$out"; exit 0
            elif [ "$code" != "000" ] && [ -n "$code" ]; then
              echo "Non-retryable HTTP $code:"; cat "$out"; cat "${RUNNER_TEMP}/spike.log"; exit 1
            fi
            sleep 1
          done
          echo "Never came up:"; cat "${RUNNER_TEMP}/spike.log"; exit 1

      - name: Gate A — tools/list carries a CLOSED schema + jeffrey/* _meta
        run: |
          req='{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
          out="${RUNNER_TEMP}/list.json"
          curl -s --max-time 10 -o "$out" \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/list' \
            -d "$req" "$URL"
          echo "tools/list:"; cat "$out"; echo
          grep -q 'sample_ping' "$out" || { echo "FAIL: sample_ping missing"; exit 1; }
          grep -q 'jeffrey/cost' "$out" || { echo "FAIL: jeffrey/* _meta missing"; exit 1; }
          if grep -qE '"\$ref"|"\$defs"' "$out"; then echo "FAIL: schema not closed"; exit 1; fi
          echo "PASS: closed schema + _meta"

      - name: Gate B — sample_confirm returns input_required
        run: |
          req='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"sample_confirm","arguments":{},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{"elicitation":{"form":{}}}}}}'
          out="${RUNNER_TEMP}/confirm.json"
          curl -s --max-time 10 -o "$out" \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/call' \
            -d "$req" "$URL"
          echo "sample_confirm:"; cat "$out"; echo
          grep -q 'input_required' "$out" || { echo "FAIL: no input_required"; exit 1; }
          grep -q 'elicitation/create' "$out" || { echo "FAIL: no elicitation/create"; exit 1; }
          echo "PASS: elicitation round-trip shape"

      - name: Gate C — sample_progress streams SSE notifications/progress
        run: |
          req='{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"sample_progress","arguments":{},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"progressToken":"p1"}}}'
          out="${RUNNER_TEMP}/progress.txt"
          curl -N -s --max-time 20 -D "${RUNNER_TEMP}/progress.hdr" -o "$out" \
            -H 'Content-Type: application/json' -H 'Accept: text/event-stream' \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/call' \
            -d "$req" "$URL"
          echo "headers:"; cat "${RUNNER_TEMP}/progress.hdr"; echo "body:"; cat "$out"; echo
          grep -qi 'text/event-stream' "${RUNNER_TEMP}/progress.hdr" || { echo "FAIL: not SSE"; exit 1; }
          grep -q 'progress' "$out" || { echo "FAIL: no progress frames"; exit 1; }
          echo "PASS: SSE progress"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Conformance suite (informational — read wire-schema-valid)
        continue-on-error: true
        run: |
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 server \
            --url "$URL" --spec-version 2026-07-28 --suite active || true
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 server \
            --url "$URL" --spec-version 2026-07-28 --scenario server-stateless || true

      - name: Stop the spike
        if: always()
        run: kill "${spike_pid}" 2>/dev/null || true

      - name: Upload spike log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-log
          path: ${{ runner.temp }}/spike.log
          if-no-files-found: ignore
