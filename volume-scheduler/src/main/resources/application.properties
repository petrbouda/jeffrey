# Server
# server.port=8080

# The recording volume: the directory that holds workspaces/ (the provisioner's jeffrey-home).
# Required, no default: the service refuses to start without it, or when it is not a directory.
#   --jeffrey.volume-scheduler.volume.path=/mnt/jeffrey
#   JEFFREY_VOLUMESCHEDULER_VOLUME_PATH=/mnt/jeffrey

# The jobs, with their defaults (VolumeSchedulerProperties). Uncomment a line to change it, or set
# the matching environment variable, e.g. JEFFREY_VOLUMESCHEDULER_RETENTION_MAXSIZE=50GB.
#
# Retention, one pass per project in this order: whole sessions whose newest recording is older
# than session-retention; the oldest logical sessions beyond max-sessions per instance (a run of
# failed-empty sessions counts as one); closed recordings of each instance's newest session older
# than newest-session-file-retention; the project's disk budget max-size, freed oldest first; and
# instance directories with no session older than instance-retention. Its storage figures are what
# GET /api/v1/storage serves.
# jeffrey.volume-scheduler.retention.enabled=true
# jeffrey.volume-scheduler.retention.period=5m
# jeffrey.volume-scheduler.retention.session-retention=7d
# jeffrey.volume-scheduler.retention.max-sessions=10
# jeffrey.volume-scheduler.retention.newest-session-file-retention=7d
# jeffrey.volume-scheduler.retention.max-size=20GB
# jeffrey.volume-scheduler.retention.instance-retention=14d
#
# Compression: LZ4 of the closed JFR recordings in each instance's two newest sessions.
# jeffrey.volume-scheduler.compression.enabled=true
# jeffrey.volume-scheduler.compression.period=1m

# Kubernetes probes: /actuator/health/liveness and /actuator/health/readiness, also outside Kubernetes.
management.endpoint.health.probes.enabled=true

# Logging is stock Spring Boot: no logback-spring.xml, so Boot configures logback itself and every
# logging.* property below behaves exactly as documented. Console only by default.
logging.level.cafe.jeffrey=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Uncomment to write a log file as well, somewhere other than the shared volume. Because Boot owns
# the logback setup, this alone is enough -- it adds the rolling file appender, and
# logging.logback.rollingpolicy.* tunes it.
# logging.file.name=/var/log/volume-scheduler.log
#
# With a file appender in place, logging.threshold.console keeps the console readable while the
# file takes everything -- set logging.level.cafe.jeffrey=TRACE and this stays at INFO.
# logging.threshold.console=INFO
