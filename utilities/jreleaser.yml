# JReleaser configuration for deploying every library under utilities/ to Maven Central.
#
# JReleaser only performs the SIGN + UPLOAD of artifacts that Maven has already
# staged into target/staging-deploy (see the release-utilities workflow).
# It replaces the central-publishing-maven-plugin + maven-gpg-plugin that used to
# live in the pom's `release` profile.
#
# Invoked with `jreleaser deploy`, so no GitHub release/tag is created here.
project:
  name: jeffrey-utilities
  description: Jeffrey libraries for profiled applications - events, heartbeat and tracing
  authors:
    - Petr Bouda
  license: Apache-2.0
  links:
    homepage: https://github.com/petrbouda/jeffrey
  languages:
    java:
      groupId: cafe.jeffrey-analyst

release:
  github:
    owner: petrbouda
    name: jeffrey
    # This config drives a Maven Central deploy only; never touch git/releases.
    skipTag: true
    skipRelease: true

signing:
  active: ALWAYS
  armored: true

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        namespace: cafe.jeffrey-analyst
        applyMavenCentralRules: true
        stagingRepositories:
          - target/staging-deploy
