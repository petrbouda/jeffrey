# Jeffrey Provisioner Init Command Configuration
# Usage: provisioner init --base-config jeffrey-init.conf [--override-config override.conf]
#
# Every key the provisioner reads is listed below; the docs page "Provisioner > Generated Output"
# shows this exact file and what it generates.
#
# Resolution order: JEFFREY_* environment variable > --override-config > --base-config > built-in default.
# Every setting has a JEFFREY_* variable (named next to it) that overrides it, so a value baked in
# here can still be changed on the pod without rebuilding the image. A key left blank ("") counts
# as not set, so the layer below still answers it. Without --base-config the provisioner is
# configured from the JEFFREY_* variables alone.
#
# Placeholders, resolved in most string values:
# - <<ENV:NAME>>                 an environment variable of the provisioner's process
# - <<JEFFREY:CURRENT_SESSION>>  this run's session directory (also CURRENT_PROJECT, FILE_PATTERN, ...)

# Root of the shared recording volume; workspaces live under <jeffrey-home>/workspaces.
# Required (here or JEFFREY_HOME) — jeffrey-jib bakes JEFFREY_HOME into the image.
jeffrey-home = "/tmp/jeffrey"

# The async-profiler library (JEFFREY_PROFILER_PATH). jeffrey-jib bakes it into the image, with
# async-profiler installed under /opt/jeffrey, so set it here only when you supply your own.
# Nothing is discovered on disk: when the library is missing, the application starts unprofiled.
profiler-path = "/opt/jeffrey/libasyncProfiler.so"

# The async-profiler agent (JEFFREY_PROFILER_COMMAND): options alone, run on the profiler-path
# library, or a full -agentpath:<library>=<options> that ignores profiler-path. Left blank, the
# built-in options are used:
#   start,alloc,lock,event=ctimer,jfrsync=default,loop=15m,chunksize=5m,file=<<JEFFREY:FILE_PATTERN>>
profiler-command = ""

# Output files
# JVM arguments file, one option per line; start the JVM with java @/tmp/jvm.args (JEFFREY_ARG_FILE)
arg-file = "/tmp/jvm.args"
# Shell file with the exported JEFFREY_* paths (and JDK_JAVA_OPTIONS) to source (JEFFREY_ENV_FILE)
env-file = "/tmp/jeffrey.env"
# Print the exported variables to stdout as well (JEFFREY_PRINT_ENV)
print-env = false
# Debug logging of the provisioner itself (JEFFREY_PROVISIONER_VERBOSE)
provisioner-verbose = false

# Project identification
project {
    # Reference ID of the workspace on the shared volume: the name of the workspace directory
    # the provisioner writes into (JEFFREY_WORKSPACE_REF_ID).
    # Optional. If omitted (or blank), the workspace "$default" is used.
    # The workspace does not have to exist: the provisioner creates its folder (and the project,
    # instance and session directories) when it is missing.
    workspace-ref-id = "uat"

    # Required (here or JEFFREY_PROJECT_NAME); letters, digits, '_' and '-' only.
    name = "jeffrey"

    # Optional (JEFFREY_INSTANCE_NAME). If omitted, the container's HOSTNAME is used, and a
    # generated ID when there is none.
    instance-name = "instance-1"
}

# Features

# Debug Non-Safepoints - more precise profiling by recording method information at
# non-safepoint locations (enabled by default; JEFFREY_DEBUG_NON_SAFEPOINTS)
# Adds: -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints
debug-non-safepoints {
    enabled = true
}

# Performance counters saved into the session directory (JEFFREY_PERF_COUNTERS)
perf-counters {
    enabled = true
}

# Heap dump on OutOfMemoryError (JEFFREY_HEAP_DUMP = exit | crash | off)
heap-dump {
    enabled = true
    type = "crash"  # "exit" or "crash"
}

# Span tracing: lowers the JFR thresholds a span is read at (JEFFREY_TRACING_ENABLED).
# Spans come from the application's own Tracer calls and from the jeffrey-tracing-*
# instrumentation libraries; nothing here instruments anything. On by default, because
# the settings cost nothing in an application that emits no spans. Set enabled = false
# to leave the stock JFR thresholds alone.
tracing {
    enabled = true

    # JFR settings for the events the Tracing view draws as blocking spans
    # (JEFFREY_TRACING_JFR_EVENT_SETTINGS).
    # The profiler records with a stock JFR configuration where socket I/O, file I/O and
    # lock waits only fire above their default thresholds, so short operations never reach a
    # trace. These settings are applied by a second, settings-only JFR recording; JFR takes the
    # most verbose setting across all active recordings, so they also lower the thresholds of
    # the profiler's own recording — the events land in both the dumped .jfr files and the
    # streamed session.
    #
    # Left empty, the built-in list is used: socket + file I/O and ZAllocationStall at 0ms (every
    # operation) and JavaMonitorEnter / JavaMonitorWait / ThreadPark / ThreadSleep /
    # VirtualThreadPinned at 1ms, which keeps idle thread-pool parking out of the traces. It also
    # lifts Java 25's 100 events/s rate limit on socket and file I/O (throttle=1000000/s; a
    # numeric rate, because "off" loses to the profiler's 100/s).
    #
    # Ignored when enabled = false. Set to "none" to opt out while leaving span tracing on,
    # or list your own settings, e.g.:
    # jfr-event-settings = "jdk.SocketRead#enabled=true,jdk.SocketRead#threshold=0ms"
    jfr-event-settings = ""
}

# JDK Java Options - also exports JDK_JAVA_OPTIONS (the same flags as the argfile) in the
# env-file, which the JVM picks up without an argfile (JEFFREY_JDK_JAVA_OPTIONS)
jdk-java-options {
    enabled = true
}

# Additional JVM options, written last so they can override anything Jeffrey set
# (JEFFREY_ADDITIONAL_JVM_OPTIONS; independent of JDK_JAVA_OPTIONS export).
# JVM unified logging goes here too: use a '.jvm-log' extension so Jeffrey recognizes the file
# as a JVM log artifact, and <<JEFFREY:CURRENT_SESSION>> to write it into the session directory.
# So does anything the application itself understands -- see the docs for an example routing a
# Spring Boot application's own log file into the session directory.
additional-jvm-options = "-Xmx1200m -Xms1200m -XX:+UseG1GC -XX:+AlwaysPreTouch -Xlog:gc*=debug:file=<<JEFFREY:CURRENT_SESSION>>/gc.jvm-log:time,uptime,level,tags:filecount=3,filesize=20m"

# Attributes (key-value map; JEFFREY_ATTRIBUTES = key=value,key=value)
# Supports HOCON substitution: ${VAR} (required) or ${?VAR} (optional)
attributes {
    cluster = "blue"
}
