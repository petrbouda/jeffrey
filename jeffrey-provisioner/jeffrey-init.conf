# Jeffrey Provisioner Init Command Configuration
# Usage: java -jar target/provisioner.jar init --base-config jeffrey-init.conf

# Resolution order: JEFFREY_* environment variable > this file > built-in default.
# Every setting below has a JEFFREY_* variable that overrides it, so a value baked
# in here can still be changed on the pod without rebuilding the image.
#
# Path resolution:
# - jeffrey-home: read from this config (e.g. jeffrey-home = "/tmp/jeffrey"),
#   or from the JEFFREY_HOME environment variable, which wins if both are set.
# - profiler-path / agent-path: auto-derived as ${jeffrey-home}/libs/current/...
#   Set them explicitly only if the binaries live outside JEFFREY_HOME.

# Project identification
project {
    # Reference ID of the workspace on the target Jeffrey server.
    # Optional. If omitted (or blank), events route to the server's default
    # workspace (reference ID "$default" unless reconfigured via
    # jeffrey.hub.default-workspace.reference-id on the server).
    # If set, the value must match an existing workspace's reference ID on the
    # server — unknown reference IDs are dropped server-side with a warning.
    workspace-ref-id = "uat"
    name = "jeffrey"
    label = "Jeffrey"
}

# Features

# Performance counters
# It's automatically used to detect finished session
perf-counters {
    enabled = true
}

# Method tracing: the agent weaves @Traced methods into spans.
# On by default; needs Java 25 and jeffrey-events on the application's class path,
# and stays inert without them. Set enabled = false (or JEFFREY_TRACING_ENABLED=false)
# to keep the agent from installing its class-file transformer at all.
tracing {
    enabled = true
}

# Heap dump on OutOfMemoryError
heap-dump {
    enabled = true
    type = "crash"  # "exit" or "crash"
}

# JVM logging with <<JEFFREY:CURRENT_SESSION>> placeholder for file path
# Use '-jvm.log' suffix to automatically recognize the file as a JVM log file by Jeffrey
jvm-logging {
    enabled = true
    command = "jfr*=trace:file=<<JEFFREY:CURRENT_SESSION>>/jfr-jvm.log::filecount=3,filesize=5m"
}

# Debug Non-Safepoints - enables more precise profiling by recording
# method information at non-safepoint locations
# Adds: -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints
debug-non-safepoints {
    enabled = true
}

# JDK Java Options - exports JDK_JAVA_OPTIONS environment variable
jdk-java-options {
    enabled = true
}

# Additional JVM options added to argfile/profiler settings (independent of JDK_JAVA_OPTIONS export)
additional-jvm-options = "-Xmx1200m -Xms1200m -XX:+UseG1GC -XX:+AlwaysPreTouch -Djeffrey.logging.trace-file.path=<<JEFFREY:CURRENT_SESSION>>/jeffrey-app.log"

# Attributes (key-value map)
# Supports HOCON substitution: ${VAR} (required) or ${?VAR} (optional)
attributes {
    cluster = "blue"
}
