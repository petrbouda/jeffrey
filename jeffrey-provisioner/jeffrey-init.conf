# Jeffrey Provisioner Init Command Configuration
# Usage: java -jar target/provisioner.jar init --base-config jeffrey-init.conf

# Resolution order: JEFFREY_* environment variable > this file > built-in default.
# Every setting below has a JEFFREY_* variable that overrides it, so a value baked
# in here can still be changed on the pod without rebuilding the image.
#
# Path resolution:
# - jeffrey-home: read from this config (e.g. jeffrey-home = "/tmp/jeffrey"),
#   or from the JEFFREY_HOME environment variable, which wins if both are set.
# - profiler-path: baked into the image as JEFFREY_PROFILER_PATH by the jeffrey-jib build
#   extension, which installs async-profiler under /opt/jeffrey. Set it explicitly only when
#   you supply your own async-profiler; nothing is discovered on disk.
# - jeffrey-agent.path: located the same way, baked as JEFFREY_AGENT_PATH by jeffrey-jib, which
#   installs the agent jar under /opt/jeffrey. Set it explicitly only outside jeffrey-jib, to the
#   jeffrey-agent.jar from the Jeffrey release.

# Project identification
project {
    # Reference ID of the workspace on the target Jeffrey server.
    # Optional. If omitted (or blank), events route to the server's default
    # workspace (reference ID "$default" unless reconfigured via
    # jeffrey.hub.default-workspace.reference-id on the server).
    # If set, the value must match an existing workspace's reference ID on the
    # server — unknown reference IDs are dropped server-side with a warning.
    workspace-ref-id = "uat"
    name = "jeffrey"
}

# Features

# Jeffrey agent: reports the JVM's liveness to the Hub (a heartbeat file, and a clean-exit
# marker on shutdown), which is how the Hub learns a session has finished.
# The provisioner adds -javaagent:<path> to the argfile, so the application needs no change. It
# touches no application code. When path names no jar, or names one that is not there, the session
# runs without it and a warning says so.
# Set enabled = false (or JEFFREY_AGENT_ENABLED=false) to run without it; liveness is then
# reported only if the application carries the jeffrey-heartbeat library (or its Spring Boot
# starter) itself. An application that carries the library anyway is safe either way: the
# library stands down while the agent reports.
jeffrey-agent {
    enabled = true
    # path = "/opt/jeffrey/jeffrey-agent.jar"   # JEFFREY_AGENT_PATH; baked by jeffrey-jib
}

# Performance counters
# It's automatically used to detect finished session
perf-counters {
    enabled = true
}

# Span tracing: lowers the JFR thresholds a span is read at.
# Spans come from the application's own Tracer calls and from the jeffrey-tracing-*
# instrumentation libraries; nothing here instruments anything. On by default, because
# the settings cost nothing in an application that emits no spans. Set enabled = false
# (or JEFFREY_TRACING_ENABLED=false) to leave the stock JFR thresholds alone.
tracing {
    enabled = true

    # JFR thresholds for the events the Tracing view draws as blocking spans.
    # The profiler records with a stock JFR configuration where socket I/O, file I/O and
    # lock waits only fire above 20 ms, so short operations never reach a trace. These
    # settings are applied by a second, settings-only JFR recording; JFR takes the most
    # verbose setting across all active recordings, so they also lower the thresholds of
    # the profiler's own recording — the events land in both the dumped .jfr files and the
    # streamed session.
    #
    # Left empty, the built-in list is used: socket + file I/O at 0ms (every operation) and
    # JavaMonitorEnter / JavaMonitorWait / ThreadPark / ThreadSleep / VirtualThreadPinned at
    # 1ms, which keeps idle thread-pool parking out of the traces.
    #
    # The settings are written to <session>/.jeffrey-events.jfc, which the recording starts
    # from (settings=...), so it carries these events only and does not switch back on what
    # async-profiler turned off for its own engines.
    #
    # Java 25's default.jfc also rate-limits socket and file I/O to 100 events a second. JFR
    # resolves a rate limit to the highest numeric rate across the running recordings, so the
    # built-in list lifts it with throttle=1000000/s ("off" is not a rate and would lose).
    #
    # Ignored when enabled = false. Set to "none" to opt out while leaving span tracing on,
    # or list your own settings, e.g.:
    # jfr-event-settings = "jdk.SocketRead#enabled=true,jdk.SocketRead#threshold=0ms"
    jfr-event-settings = ""
}

# Extra JFR events to record beside the profiler, for events the profiler's configuration
# leaves off or records above the threshold you need. Comma-separated event#setting=value
# entries (JEFFREY_JFR_ADD_EVENT_SETTINGS); every listed event is enabled. They go into the same
# <session>/.jeffrey-events.jfc recording as the tracing thresholds, after them, so they win
# where both name a setting. They can only add: enabled=false is refused, because JFR keeps an
# event on while any recording enables it. To switch events off, point profiler-command at a
# .jfc of your own (jfrsync=/path/to/your.jfc). e.g.:
# add-event-settings = "jdk.JavaExceptionThrow#stackTrace=true,jdk.ThreadSleep#threshold=0ms"
jfr {
    add-event-settings = ""
}

# Heap dump on OutOfMemoryError
heap-dump {
    enabled = true
    type = "crash"  # "exit" or "crash"
}

# Debug Non-Safepoints - enables more precise profiling by recording
# method information at non-safepoint locations
# Adds: -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints
debug-non-safepoints {
    enabled = true
}

# JDK Java Options - exports JDK_JAVA_OPTIONS environment variable
jdk-java-options {
    enabled = true
}

# Additional JVM options added to argfile/profiler settings (independent of JDK_JAVA_OPTIONS export)
# JVM unified logging goes here too: use a '.jvm-log' extension so Jeffrey recognizes the file
# as a JVM log artifact, and <<JEFFREY:CURRENT_SESSION>> to write it into the session directory.
# So does anything the application itself understands -- see the docs for an example routing a
# Spring Boot application's own log file into the session directory.
additional-jvm-options = "-Xmx1200m -Xms1200m -XX:+UseG1GC -XX:+AlwaysPreTouch -Xlog:gc*=debug:file=<<JEFFREY:CURRENT_SESSION>>/gc.jvm-log:time,uptime,level,tags:filecount=3,filesize=20m"

# Attributes (key-value map)
# Supports HOCON substitution: ${VAR} (required) or ${?VAR} (optional)
attributes {
    cluster = "blue"
}
