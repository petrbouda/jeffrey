# Full configuration with all options specified

jeffrey-home = "/tmp/jeffrey"

profiler-path = "/tmp/asprof/libasyncProfiler.so"

project {
    workspace-ref-id = "uat"
    name = "test-project"
    label = "Test Project"
    instance-name = ""
}

repository-type = "ASYNC_PROFILER"

perf-counters {
    enabled = true
}

heap-dump {
    enabled = true
    type = "crash"
}

jdk-java-options {
    enabled = true
}

additional-jvm-options = "-Xmx1200m -Xms1200m"

debug-non-safepoints {
    enabled = true
}

attributes {
    cluster = "blue"
}
