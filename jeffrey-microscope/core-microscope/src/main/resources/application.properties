# Server
# 8585 rather than Spring Boot's 8080: Microscope is a tool you leave running beside the
# application you are profiling, and that application is very often the one already holding
# 8080. Overridable as any other Spring property.
server.port=8585

# Which interfaces to serve on. Left unset, Spring Boot binds all of them, so a Microscope on a
# laptop is reachable from that laptop's network. Nothing under /api/internal authenticates --
# reachable means trusted -- and that includes the MCP endpoint below, which reads every profile
# in the installation. On any network you do not control, bind to loopback:
# server.address=127.0.0.1

# Serve HTTP requests on virtual threads (Tomcat + Spring task executors). Requires JDK 21+.
# Note: under async-profiler, a long request can unmount/remount across carrier threads, which
# reduces the accuracy of the "events during span" thread+time correlation (carrier fragmentation).
spring.threads.virtual.enabled=true

# Compress analysis responses. The JSON this app serves (thread timelines, timeseries, event
# tables) is highly repetitive — repeated keys, repeated file paths and host names — so gzip cuts
# it by more than an order of magnitude. Below the threshold the round-trip costs more than it saves.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=2KB

# Multipart uploads — unlimited (JFR recordings and heap dumps can be multi-GB)
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

# Jackson: accept missing/null primitive fields in request bodies and fall back to defaults
# (e.g. boolean -> false, int -> 0). Frees REST clients from having to send every primitive.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Core directories
# Multiple options to set it up:
# Program option: -Djeffrey.microscope.home.dir=...
# Environment Variable: JEFFREY_LOCAL_HOME_DIR=...
jeffrey.microscope.home.dir=${user.home}/.jeffrey-microscope
jeffrey.microscope.temp.dir=${jeffrey.microscope.home.dir}/temp

# Version update check (set to false to disable GitHub release checking)
# jeffrey.microscope.update-check.enabled=true

# External MCP server at POST /api/mcp, for a Claude Code session in your own repository.
# On by default; it has no authentication of its own, so keep Jeffrey on localhost or behind a
# tunnel/proxy. Set to false to make the endpoint answer 404 (takes a restart).
# jeffrey.microscope.mcp.enabled=true

# Hostnames accepted in the effective request authority for the MCP endpoint, comma-separated. The
# default admits only IPv4/IPv6 loopback. Set this list to the public hostname when exposing Jeffrey
# remotely or behind a reverse proxy, retaining any loopback names that clients still use. When a
# trusted proxy terminates TLS or rewrites Host, configure Spring Boot's server.forward-headers-strategy
# so the servlet request exposes the public scheme, host and port; the MCP guard deliberately does not
# interpret X-Forwarded-* headers itself (takes a restart).
# jeffrey.microscope.mcp.allowed-hosts=localhost,127.0.0.1,::1

# The hubs_ family, which lets that session list the recording sessions on the connected Jeffrey Hubs
# below and pull one into this Jeffrey to analyse. Its own switch because it is the one family that
# leaves this machine: everything else reads what is already here, while this reaches out to remote
# infrastructure and can move gigabytes off it. Set to false to refuse hub access while keeping the
# rest (takes a restart).
# jeffrey.microscope.mcp.hubs.enabled=true

# How long the hubs_ tools spend discovering what a hub holds before answering with what arrived. One
# cancelling deadline shared by every remote call a scan makes: a hub that stops answering is
# abandoned rather than waited out, and the sessions other hubs already returned are still reported,
# with each unreachable scope named beside them. A positive ISO-8601 duration (takes a restart).
# jeffrey.microscope.mcp.hubs.scan-timeout=PT20S

# How long hubs_download waits before answering that the transfer is still running, session lookup
# included. It bounds the answer, not the work: a transfer that outlasts it carries on, and calling
# the tool again with the same session reports the finished copy. Sized under the shortest client
# timeout worth designing for (takes a restart).
# jeffrey.microscope.mcp.hubs.download-response-timeout=PT45S

# How long the transfer itself may take once it is running in the background -- gigabytes over
# whatever link the hub is on, which is a different measurement from the response deadline above.
# This is the one to raise for large recordings on a slow connection (takes a restart).
# jeffrey.microscope.mcp.hubs.download-timeout=PT1H

# The ide_ family, which lets that session ask the developer's running IntelliJ where a frame lives,
# read a class through it, and open a file in it. Its own switch for the same reason as hubs_, one
# step closer to home: everything else reads a recording Jeffrey already holds, while this reaches
# into another process on this machine and can put a file on somebody's screen. It needs the Jeffrey
# IntelliJ plugin, and answers nothing until a window is linked to the profile (takes a restart).
# jeffrey.microscope.mcp.ide.enabled=true

# Which tool families to advertise, comma-separated; empty means all of them. Worth setting only for
# a client that pays for the whole tool list on every turn -- Codex loads every schema each time,
# where Claude Code fetches them on demand. Families are named by their tool prefix: profiles, jfr,
# flamegraph, compare, traces, jvm, http, jdbc, grpc, methodtracing, io, blocking, timeline, memory,
# heap, recordings, hubs, ide (takes a restart).
# jeffrey.microscope.mcp.families=profiles,flamegraph,jvm,heap

# Prune threshold (%) for the Markdown flamegraph export handed to a coding agent -- the Copy-for-AI
# buttons and the MCP flamegraph, compare and trace-span exports. Subtrees below this share of the
# samples are dropped. Coarser than the visualization threshold on purpose, to keep the export
# compact.
# jeffrey.microscope.ai-export.flamegraph.min-frame-threshold-pct=1.0


# Jeffrey Hub connections declared up front, so a container or a pod comes up already connected
# instead of waiting for someone to add a hub through the UI. The key (production, staging, ...)
# names the hub and is what its stored id is derived from, so keep it stable.
#
# Configuration OWNS these hubs: on every startup they are added, updated and removed to match
# what is declared here, and the UI shows them read-only. Hubs added through the UI are untouched.
# No connection is attempted at startup, so a hub that boots after Microscope works as soon as it
# comes up. Only `hostname` is required; `name` defaults to the key, `port` to 9090, `plaintext`
# (cleartext h2c instead of TLS) to false.
#
# When setting these through environment variables, keep the key to a single alphanumeric token --
# JEFFREY_MICROSCOPE_HUBS_PRODEU_HOSTNAME works, a dashed key does not survive the translation.
#
#jeffrey.microscope.hubs.production.name=Production
#jeffrey.microscope.hubs.production.hostname=hub.example.com
#jeffrey.microscope.hubs.production.port=443
#jeffrey.microscope.hubs.staging.hostname=staging.internal
#jeffrey.microscope.hubs.staging.port=9090
#jeffrey.microscope.hubs.staging.plaintext=true

# IDE integration is always available (shows onboarding until an IntelliJ window is linked).
# Default mode is the first-party Jeffrey IntelliJ plugin, discovered by scanning localhost.
#jeffrey.microscope.ide.scan.port-start=63342
#jeffrey.microscope.ide.scan.port-end=63362
# To use the third-party JFR Profiler plugin instead, both of these are required:
#jeffrey.microscope.ide.mode=jfr-profiler-plugin
#jeffrey.microscope.ide.base-url=http://localhost:4243

# Logging is stock Spring Boot: no logback-spring.xml, so Boot configures logback itself and every
# logging.* property below behaves exactly as documented. Console only by default.
logging.level.cafe.jeffrey=INFO
logging.level.org.flywaydb=WARN
logging.level.org.openjdk.jmc.flightrecorder.internal.parser=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-no-req}] %logger{36} - %msg %X{name}%n

# Uncomment to write a log file as well. Because Boot owns the logback setup, this alone is enough --
# it adds the rolling file appender, and logging.logback.rollingpolicy.* tunes it.
# logging.file.name=${jeffrey.microscope.home.dir}/logs/jeffrey.log
#
# With a file appender in place, logging.threshold.console keeps the console readable while the
# file takes everything -- set logging.level.cafe.jeffrey=TRACE and this stays at INFO.
# logging.threshold.console=INFO

# Frames narrower than this share (%) of the total samples are collapsed away before a flamegraph is
# drawn. Lower shows more detail and costs rendering time; 0 shows every frame.
# jeffrey.microscope.visualization.flamegraph.min-frame-threshold-pct=0.05

# How a flamegraph labels its frames: single-line or two-line. This is the default the UI starts
# with; each flamegraph still has its own toggle.
# jeffrey.microscope.visualization.flamegraph.frame-text-mode=single-line

# Jeffrey's own JFR HTTP instrumentation, from jeffrey-tracing-spring-boot-starter.
# These values reproduce exactly what the hand-written filter in this module did before
# the starter replaced it: only /api/* is traced, the filter sits just after the
# request-logging filter (HIGHEST_PRECEDENCE + 10), and both parameter maps are recorded.
# Parameter capture is off by default in the library - a recording is a file that gets
# shared, and query strings elsewhere routinely carry tokens - so Jeffrey opts in for
# itself, where the parameters are known to be safe.
jeffrey.tracing.url-patterns=/api/*
jeffrey.tracing.order=-2147483638
jeffrey.tracing.capture-query-params=true
jeffrey.tracing.capture-path-params=true
