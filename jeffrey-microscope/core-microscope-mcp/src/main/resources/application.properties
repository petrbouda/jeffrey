# Server — the same port the full Microscope uses, so the Claude Code plugin's default endpoint
# (http://localhost:8080/api/internal/mcp) works unchanged.
# server.port=8080

# Serve HTTP requests on virtual threads (Tomcat + Spring task executors).
spring.threads.virtual.enabled=true

# Compress responses: tool results are JSON with repeated keys, paths and host names.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=2KB

# Core directories — the same home the full Microscope writes, so its analysed profiles are what
# this server answers about. Do not run both against one home at once: DuckDB locks its files.
# Program option: -Djeffrey.microscope.home.dir=...
jeffrey.microscope.home.dir=${user.home}/.jeffrey-microscope
jeffrey.microscope.temp.dir=${jeffrey.microscope.home.dir}/temp

# Visualization and logging settings come from settings-mappings.conf and the settings stored in
# the home directory's core database, exactly as in the full Microscope.
