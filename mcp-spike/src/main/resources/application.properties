spring.application.name=jeffrey-mcp-spike
server.port=8585

# --- Jeffrey's MCP endpoint shape, reproduced on Spring AI's modern server ---
# Modern == stateless 2026-07-28 (no initialize, no session, server/discover).
spring.ai.mcp.server.protocol=MODERN
spring.ai.mcp.server.name=jeffrey-spike
spring.ai.mcp.server.version=0.0.1

# Jeffrey's single endpoint. GET/DELETE answer 405; POST-only because we register
# NO McpSyncNotifier anywhere -> the server never switches to text/event-stream (no SSE).
spring.ai.mcp.server.modern.mcp-endpoint=/api/mcp
spring.ai.mcp.server.modern.supported-versions=2026-07-28
spring.ai.mcp.server.modern.page-size=50

# HMAC secret that seals the elicitation requestState (>= 32 bytes). DEMO ONLY.
spring.ai.mcp.server.modern.request-state-secret=spike-demo-secret-please-change-0123456789
