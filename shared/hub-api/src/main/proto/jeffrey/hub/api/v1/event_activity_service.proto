syntax = "proto3";

package jeffrey.hub.api.v1;

option java_package = "cafe.jeffrey.hub.api.v1";
option java_multiple_files = true;

// Counts JFR events on the Hub and returns bounded time-bucket summaries, so a caller can find the
// busy intervals of a session before downloading it. This service returns counts, scan metadata and
// coverage information; it does not transfer recordings or raw events.
//
// An admitted scan runs independently of its starting RPC. StartActivity returns a scan_id and an
// initial observation; GetActivity polls it; CancelActivity requests cancellation. All three return
// EventActivitySnapshot. Losing a start response can leave an admitted scan running without the
// caller knowing its ID; retrying StartActivity creates another scan.
//
// Scans are local to one Hub process: at most 16 are retained, at most two read at a time, and a
// terminal result is retained for up to one hour after it finished. A new scan may evict the oldest
// terminal result earlier when all 16 slots are occupied. Restarting Hub forgets every scan_id.
service EventActivityService {
  // Resolves the finished files in scope, admits a scan, and returns its first snapshot without
  // waiting for the scan to finish. The snapshot can already be RUNNING or terminal.
  // The scope is resolved first, so an unknown workspace, project or session is NOT_FOUND here
  // rather than a scan_id that only reports a failure when it is first polled.
  // INVALID_ARGUMENT indicates an invalid scope, time window, bucket width or event-type filter.
  // RESOURCE_EXHAUSTED indicates unavailable scan capacity, including when the service is stopping.
  // The initial page uses ACTIVITY_ORDER_EVENTS, limit 20 and offset 0.
  rpc StartActivity(StartActivityRequest) returns (EventActivitySnapshot);

  // Reads one page of a scan's buckets without restarting or extending it.
  // NOT_FOUND covers a scan_id that never existed, expired, was evicted, or does not match the full
  // workspace/project/session scope. INVALID_ARGUMENT indicates invalid scope or paging parameters.
  rpc GetActivity(GetActivityRequest) returns (EventActivitySnapshot);

  // Requests cancellation of one exact scan. Cancellation is cooperative and may lose a race with
  // completion; repeating it is safe. CANCEL_REQUESTED is nonterminal until the reader and cleanup
  // finish. Counts already taken remain readable until expiry or eviction.
  // Returns ACTIVITY_ORDER_EVENTS, limit 20 and offset 0. NOT_FOUND has the same meaning as GetActivity;
  // INVALID_ARGUMENT indicates invalid scope or scan_id.
  rpc CancelActivity(CancelActivityRequest) returns (EventActivitySnapshot);
}

// Identifies one recording session. Carried on every request and echoed on every snapshot, because
// a scan_id alone does not say which session it belongs to and must never read across sessions.
message ActivityScope {
  // Required, nonblank, at most 512 characters. The project must belong to this workspace.
  string workspace_id = 1;
  // Required, nonblank, at most 512 characters. The session must belong to this project.
  string project_id = 2;
  // Required, nonblank, at most 512 characters.
  string session_id = 3;
}

// Request to start counting a session's events over a window.
message StartActivityRequest {
  ActivityScope scope = 1;
  // Required inclusive lower bound, UTC epoch milliseconds. start_time must be less than end_time.
  optional int64 start_time = 2;
  // Required exclusive upper bound, UTC epoch milliseconds. Events exactly at end_time are excluded.
  optional int64 end_time = 3;
  // Positive bucket width in seconds (default: 300 when absent; zero is invalid).
  // The window must divide into at most 288 buckets,
  // which is what bounds a scan's memory. Buckets are anchored at start_time, so the last one is
  // short whenever the window is not a whole multiple of the width.
  optional int64 bucket_seconds = 4;
  // Exact JFR event type names: at most 16 distinct nonblank names, each at most 256 characters.
  // Empty means all types. A scan can count up to 512 observed types; a 513th matching type, or a
  // matching type name longer than 256 characters, fails the scan and preserves its partial counts.
  repeated string event_types = 5;
}

// How buckets are ranked before offset and limit are applied. Count ties use earlier start_time first.
enum ActivityOrder {
  // Treated as ACTIVITY_ORDER_EVENTS.
  ACTIVITY_ORDER_UNSPECIFIED = 0;
  // Busiest first, by event count.
  ACTIVITY_ORDER_EVENTS = 1;
  // Greatest variety first, by distinct event types.
  ACTIVITY_ORDER_TYPES = 2;
  // Chronological.
  ACTIVITY_ORDER_TIME = 3;
}

// Request to read one page of a scan's buckets.
message GetActivityRequest {
  ActivityScope scope = 1;
  // Required scan_id returned by StartActivity, nonblank and at most 512 characters.
  string scan_id = 2;
  // Defaults to ACTIVITY_ORDER_EVENTS; unknown enum values are invalid.
  ActivityOrder order = 3;
  // Buckets per page (default: 20). Range 1–20. Totals are unaffected by this cap.
  optional int32 limit = 4;
  // Buckets to skip in the ranked order before this page (default: 0). Range 0–288.
  // An offset at or beyond total_buckets returns an empty page. Advance by the number of buckets
  // returned while has_more_buckets is true. Rankings can change while a scan is active; wait for a
  // terminal state before paging a stable result, or use ACTIVITY_ORDER_TIME for stable bucket order.
  optional int32 offset = 5;
}

// Request to cancel one exact scan.
message CancelActivityRequest {
  ActivityScope scope = 1;
  // Required scan_id returned by StartActivity, nonblank and at most 512 characters.
  string scan_id = 2;
}

// Lifecycle of a scan. A cancellation request is not itself terminal.
enum ActivityState {
  // Never sent; present because proto3 requires a zero value.
  ACTIVITY_STATE_UNSPECIFIED = 0;
  // Admitted, waiting for one of the two reader slots.
  ACTIVITY_STATE_QUEUED = 1;
  // Reading files or completing reader cleanup.
  ACTIVITY_STATE_RUNNING = 2;
  // Cancellation asked for; the reader has not finished releasing its scratch files.
  ACTIVITY_STATE_CANCEL_REQUESTED = 3;
  // The reader finished attempting all files in scope and reported coverage. Recoverable source
  // errors can still make complete false; inspect source_errors.
  ACTIVITY_STATE_COMPLETED = 4;
  // The reader stopped after cancellation and released its scratch files.
  ACTIVITY_STATE_CANCELLED = 5;
  // A fatal failure or capacity limit stopped the scan; partial counts may be present.
  ACTIVITY_STATE_FAILED = 6;
}

// Events of one type counted inside one bucket.
message ActivityTypeCount {
  string event_type = 1;
  int64 count = 2;
}

// One interval of the requested window. Empty buckets are reported rather than skipped, so the
// returned page describes a continuous time axis under ACTIVITY_ORDER_TIME.
message ActivityBucket {
  // Epoch millis. The interval is half-open, [start_time, end_time).
  int64 start_time = 1;
  // start_time plus the bucket width, except for the last bucket of the window, which is clamped
  // to the requested end_time.
  int64 end_time = 2;
  int64 event_count = 3;
  // Types seen in this bucket, counting the ones event_types does not list.
  int32 distinct_event_types = 4;
  // distinct_event_types minus the number carried in event_types.
  int32 omitted_types = 5;
  // The busiest types in this bucket, at most 10, highest count first; ties use event_type order.
  repeated ActivityTypeCount event_types = 6;
}

// One observation of a scan: its lifecycle, what it was asked for, and one page of what it counted.
//
// Counts describe recorded events, not the work that produced them, and two recordings that overlap
// in time may both contain the same event. Coverage is the finished files that were visible when the
// scan was resolved, so files finished afterwards are excluded. Incomplete counts are lower bounds.
// Counts and rankings may change while the scan is active. Terminal partial results are stable,
// even though they do not cover every matching event.
message EventActivitySnapshot {
  string scan_id = 1;
  // Echoes the requested scope, so a caller can verify it was answered about the session it asked
  // about rather than trusting the transport.
  ActivityScope scope = 2;
  ActivityState state = 3;
  // Epoch millis. Set when the scan was admitted, not when a reader picked it up.
  int64 started_at = 4;
  // Epoch millis. Absent until the scan reaches a terminal state.
  optional int64 finished_at = 5;
  // True only after the scan finished with known coverage, no source errors and no fatal failure.
  // A terminal state alone does not imply complete coverage.
  bool complete = 6;
  // Whether the reader reported its final coverage after attempting every file in scope. This can
  // be true with skipped/corrupt files, so inspect source_errors as well. It may become true during
  // cleanup before the scan reaches a terminal state.
  bool coverage_known = 7;
  // Recoverable source-read errors reported by the reader; scoped activity scans count failed files.
  // Meaningful as a final error count only when coverage_known is true; zero alone does not prove complete coverage.
  int64 source_errors = 8;
  // Files that were in scope when the scan started.
  int32 files_total = 9;
  // Fatal failure explanation, when available. It can appear while reader cleanup is still in
  // progress, before state becomes ACTIVITY_STATE_FAILED. Recoverable source errors use source_errors.
  optional string error = 10;

  // ----- What was asked for, echoed so a page can be read without the request beside it. -----

  // The requested window, epoch millis, half-open [start_time, end_time).
  int64 start_time = 11;
  int64 end_time = 12;
  // Bucket width in milliseconds.
  int64 bucket_millis = 13;
  // The event_types filter this scan was started with, sorted; empty means every type.
  // Not the types observed — those are counted per bucket in ActivityBucket.event_types.
  repeated string requested_event_types = 14;

  // ----- What was counted. Totals cover the whole scan, not just the buckets on this page. -----

  int64 total_events = 15;
  int32 distinct_event_types = 16;
  // Buckets the window divides into, whatever this page carries.
  int32 total_buckets = 17;
  // The order this page was ranked by, resolved from ACTIVITY_ORDER_UNSPECIFIED.
  ActivityOrder order = 18;
  // The requested offset. The next offset is this value plus the number of returned buckets.
  int32 offset = 19;
  // total_buckets minus the number carried on this page, including buckets before offset and
  // after this page. This is not the number remaining after this page.
  int32 omitted_buckets = 20;
  // True when offset plus the buckets on this page is short of total_buckets.
  bool has_more_buckets = 21;
  repeated ActivityBucket buckets = 22;
}
