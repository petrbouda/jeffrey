syntax = "proto3";

package jeffrey.hub.api.v1;

option java_package = "cafe.jeffrey.hub.api.v1";
option java_multiple_files = true;

import "jeffrey/hub/api/v1/common.proto";

// Manages a project's repository — the files its sessions produced, whatever they are,
// organized into sessions. Provides session listing, statistics, and deletion.
service RepositoryService {
  // Lists the recording sessions of a project, newest first. An optional filter narrows the
  // listing to sessions that were recording inside a time window, to one status, or to the
  // newest N, so a caller asking for "the last hour" gets exactly those sessions back.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // Gets detailed information about a single recording session, including its files.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);

  // Gets aggregate statistics about the repository (file counts, sizes by type).
  rpc GetRepositoryStatistics(GetRepositoryStatisticsRequest) returns (GetRepositoryStatisticsResponse);

  // Deletes a recording session and all its associated files from the repository.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);

  // Deletes specific files within a recording session.
  rpc DeleteFilesInSession(DeleteFilesInSessionRequest) returns (DeleteFilesInSessionResponse);

  // Marks a recording session as retained, exempting it from every retention job,
  // or releases it again so normal retention resumes.
  rpc SetSessionRetained(SetSessionRetainedRequest) returns (SetSessionRetainedResponse);
}

message ListSessionsRequest {
  string project_id = 1;
  // Narrows the listing. Absent, or with every field unset, returns every session.
  SessionFilter filter = 2;
}

// Constraints on a session listing. Every field is optional and an unset field does not
// restrict anything; set fields are combined with AND.
message SessionFilter {
  // Only sessions that were recording at some point between active_from and active_to
  // (epoch millis). A session overlaps the window when it started at or before active_to and
  // had not finished before active_from, so a session that is still running always matches a
  // window that reaches the present. Either bound may be left unset to leave that side open.
  optional int64 active_from = 1;
  optional int64 active_to = 2;
  // Only sessions in this status. RECORDING_STATUS_UNSPECIFIED matches every status.
  RecordingStatus status = 3;
  // Return at most this many sessions, newest first. Zero means no cap.
  int32 limit = 4;
}

message ListSessionsResponse {
  repeated RecordingSession sessions = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  RecordingSession session = 1;
}

message GetRepositoryStatisticsRequest {
  string project_id = 1;
}

// What a project's repository occupies on the hub, in bytes.
//
// One number, and deliberately no per-file-type breakdown: a bucket per kind would make the hub
// decide what every file type means, which is the reader's job and not the hub's.
//
// There is deliberately no capacity to divide this by either. The shared volume the hub reads is
// ReadWriteMany — hostPath, NFS or EFS in these docs — and on none of those does the filesystem
// report the claim's size: NFS reports the whole export, EFS reports an enormous constant, and
// hostPath reports the node's own disk. A percentage built on any of those would be fiction.
message GetRepositoryStatisticsResponse {
  // Total size in bytes of every file in every session of the project.
  int64 total_size = 4;

  // Numbers held by fields this message no longer carries. Do not reuse them.
  reserved 1 to 3, 5 to 18;
  reserved "total_sessions", "session_status", "last_activity_time", "total_files",
      "biggest_session_size", "jfr_files", "jfr_size", "heap_dump_files", "heap_dump_size",
      "log_files", "log_size", "app_log_files", "app_log_size", "error_log_files",
      "error_log_size", "other_files", "other_size";
}

message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionResponse {}

message DeleteFilesInSessionRequest {
  string session_id = 1;
  // IDs of specific files to delete within the session.
  repeated string file_ids = 2;
}

message DeleteFilesInSessionResponse {}

message SetSessionRetainedRequest {
  string session_id = 1;
  // True to exempt the session from retention, false to release it.
  bool retained = 2;
}

message SetSessionRetainedResponse {}

// A recording session — a continuous profiling period that produces files.
// Sessions are created when the profiler starts and finished when
// the heartbeat goes stale or the JVM shuts down.
message RecordingSession {
  // Unique identifier for the session.
  string id = 1;
  // Display name of the session.
  string name = 2;
  // ID of the instance that produced this session (if tracked).
  optional string instance_id = 3;
  // Timestamp when the session started (epoch millis).
  int64 created_at = 4;
  // Timestamp when the session finished (epoch millis).
  optional int64 finished_at = 5;
  // Current status.
  RecordingStatus status = 6;
  // Files produced during this session, of every kind.
  repeated RepositoryFile files = 7;
  // Whether this session is exempt from retention jobs.
  bool retained = 8;
}

// A single file within a session.
//
// A file carries no status of its own. Whether one is still being written is a fact about the
// session — a session that is still recording holds exactly one file open, and it is the newest
// one by created_at — so the reader derives it from the enclosing RecordingSession rather than
// being told. The hub's part is to say which files exist and when each was opened.
message RepositoryFile {
  // Unique identifier for the file.
  string id = 1;
  // The file's name, as it is on the hub's disk.
  string name = 2;
  // When the file was opened (epoch millis). A type whose timestamp is carried in its own name
  // reports that one, and it survives the hub renaming the file; every other type reports what
  // the filesystem says.
  int64 created_at = 3;
  // File size in bytes.
  int64 size = 4;
  // Number 5 was `string file_type`, a ManagedFile name the hub no longer has: it reads none of
  // the files it serves and tells no kind apart beyond a recording. A caller wanting to know a
  // heap dump from a log classifies `name` itself. Do not reuse the number.
  //
  // Whether the file is a recording chunk (true) or anything else beside one (false). A category,
  // not a format — the one thing about a file's kind the hub decides, because it is what a
  // download takes and what a session's window spans.
  bool is_recording = 7;

  // Held by a per-file status this message no longer carries. Do not reuse it.
  reserved 6;
  reserved "status";
}
