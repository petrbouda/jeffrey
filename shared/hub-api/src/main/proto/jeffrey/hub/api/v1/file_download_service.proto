syntax = "proto3";

package jeffrey.hub.api.v1;

option java_package = "cafe.jeffrey.hub.api.v1";
option java_multiple_files = true;

// Downloads a file of a recording session, whatever that file is.
//
// Files are streamed in 64KB chunks, so a file of any size transfers without being held in
// memory on either side.
//
// One file per call, always. A caller that wants several asks for each of them separately, in
// parallel, and keeps them separate: the hub never joins files.
service FileDownloadService {
  // Streams the file the id names.
  //
  // The hub hands the bytes over and does not interpret them. What a file is decides what the
  // caller does with it afterwards, and the caller read that off the listing that gave it the id.
  //
  // What the hub does refuse, each naming its reason: a file the session does not hold, a
  // transient one, one that is still being written, and one that is empty.
  rpc DownloadFile(DownloadFileRequest) returns (stream DataChunk);
}

message DownloadFileRequest {
  string session_id = 1;
  // The ID of the file to download, as the session's listing reports it.
  string file_id = 2;
}

// A chunk of binary data for streaming file transfers.
// The stream consists of sequential chunks that, when concatenated,
// form the complete file.
message DataChunk {
  // Binary content of this chunk (up to 64KB).
  bytes data = 1;
  // Total size of the complete file in bytes. Sent on the first chunk only.
  int64 total_size = 2;
  // The name the file has on the hub at the moment it is sent, which is what the receiver must
  // write it as. Not the name the caller asked for: a caller holds a listing taken some time
  // earlier, and the hub may have renamed the file since. Written under the remembered name, the
  // bytes arrive as something a reader going by the name reads wrongly.
  //
  // Sent on the first chunk only. A file with no bytes is one chunk carrying just this and the
  // size.
  string filename = 3;
}
