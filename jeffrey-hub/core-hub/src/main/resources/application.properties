# Server
# server.port=8080

# gRPC server (Spring gRPC auto-configuration). Health and reflection services are disabled
# to keep the exposed gRPC surface limited to Jeffrey's own services.
spring.grpc.server.port=9090
spring.grpc.server.health.enabled=false
spring.grpc.server.reflection.enabled=false

# Core directories
# Multiple options to set it up:
# Program option: -Djeffrey.hub.home.dir=...
# Environment Variable: JEFFREY_HUB_HOME_DIR=...
jeffrey.hub.home.dir=${user.home}/.jeffrey-hub
jeffrey.hub.temp.dir=${jeffrey.hub.home.dir}/temp

# Auto-create a workspace when a filesystem event arrives with an unknown
# reference id (removes the manual create-workspace-in-UI onboarding step).
# jeffrey.hub.workspaces.auto-create=true

# Logging is stock Spring Boot: no logback-spring.xml, so Boot configures logback itself and every
# logging.* property below behaves exactly as documented. Console only by default.
logging.level.cafe.jeffrey=INFO
logging.level.org.flywaydb=WARN
logging.level.com.zaxxer.hikari=ERROR
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-no-req}] %logger{36} - %msg %X{name}%n

# Uncomment to write a log file as well. Because Boot owns the logback setup, this alone is enough --
# it adds the rolling file appender, and logging.logback.rollingpolicy.* tunes it.
# logging.file.name=${jeffrey.hub.home.dir}/logs/jeffrey.log
#
# With a file appender in place, logging.threshold.console keeps the console readable while the
# file takes everything -- set logging.level.cafe.jeffrey=TRACE and this stays at INFO.
# logging.threshold.console=INFO
