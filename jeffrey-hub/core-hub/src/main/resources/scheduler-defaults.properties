# ----------------------------------------------------------------------------
# Built-in defaults for scheduler jobs
# ----------------------------------------------------------------------------
# Loaded as a low-precedence property source via @PropertySource on
# HubAppConfiguration. application.properties overrides any field by simply
# redeclaring the same key; missing keys fall through to the values below.
#
# Property key shape: jeffrey.hub.scheduler.jobs.<job-name>.<field>
# where <job-name> is the lower-kebab-case form of a JobType value.

# Thread pool size of the scheduler; every job iterates the projects of every workspace.
jeffrey.hub.scheduler.fan-out-pool-size=2

# project-retention
#
# One retention pass per project: it lists the project's sessions once and applies, in order:
#  - session-retention: a finished session goes whole once it is older than the window
#    (measured from the session's start);
#  - max-sessions: a cap of logical sessions per instance. A consecutive run of failed sessions
#    (finished with zero bytes, a crash loop) counts as ONE; the live session occupies a slot;
#    retained (pinned) sessions neither occupy a slot nor expire. Oldest logical sessions beyond
#    the cap go even before the age window expires;
#  - active-session-file-retention: a session still recording loses its closed chunks older than
#    the window, so a session that runs for weeks stays bounded; the open chunk is never touched;
#  - max-size: a disk budget per project, reclaimed oldest-first: whole finished sessions, then
#    closed chunks of live sessions. Retained sessions are never reclaimed. K/M/G/T (binary) or bytes;
#  - instance-retention: PENDING instances that streamed no session within it are deleted with
#    their directories.
# What is left is the project's figure on the storage dashboard, so that is up to one period stale.
jeffrey.hub.scheduler.jobs.project-retention.enabled=true
jeffrey.hub.scheduler.jobs.project-retention.period=5m
jeffrey.hub.scheduler.jobs.project-retention.params.session-retention=7d
jeffrey.hub.scheduler.jobs.project-retention.params.max-sessions=10
jeffrey.hub.scheduler.jobs.project-retention.params.active-session-file-retention=7d
jeffrey.hub.scheduler.jobs.project-retention.params.max-size=20G
jeffrey.hub.scheduler.jobs.project-retention.params.instance-retention=14d

jeffrey.hub.scheduler.jobs.repository-jfr-compression.enabled=true
jeffrey.hub.scheduler.jobs.repository-jfr-compression.period=1m


