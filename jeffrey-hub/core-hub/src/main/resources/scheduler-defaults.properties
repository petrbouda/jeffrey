# ----------------------------------------------------------------------------
# Built-in defaults for scheduler jobs
# ----------------------------------------------------------------------------
# Loaded as a low-precedence property source via @PropertySource on
# HubAppConfiguration. application.properties overrides any field by simply
# redeclaring the same key; missing keys fall through to the values below.
#
# Property key shape: jeffrey.hub.scheduler.jobs.<job-name>.<field>
# where <job-name> is the lower-kebab-case form of a JobType value.

# Thread pool size for PROJECT_FAN_OUT jobs (workspace/project iteration).
# GLOBAL jobs always run on their own dedicated single thread.
jeffrey.hub.scheduler.fan-out-pool-size=2

# GLOBAL — run once per period
jeffrey.hub.scheduler.jobs.workspace-reconciler.enabled=true
jeffrey.hub.scheduler.jobs.workspace-reconciler.period=30s

jeffrey.hub.scheduler.jobs.workspace-events-cleaner.enabled=true
jeffrey.hub.scheduler.jobs.workspace-events-cleaner.period=5m
jeffrey.hub.scheduler.jobs.workspace-events-cleaner.params.queue-events-retention=31d

# Removes scratch entries (JFR merges, compression staging, replay windows) leaked by crashed operations
jeffrey.hub.scheduler.jobs.temp-directory-cleaner.enabled=true
jeffrey.hub.scheduler.jobs.temp-directory-cleaner.period=5m
jeffrey.hub.scheduler.jobs.temp-directory-cleaner.params.retention=30m

# Hard-deletes soft-deleted project rows (tombstones) after the retention window.
# Doubles as the window in which a deleted project can still be restored, so it is
# measured in days rather than minutes — a purge that outruns the operator makes the
# soft delete and its restore path pointless.
jeffrey.hub.scheduler.jobs.deleted-projects-cleaner.enabled=true
jeffrey.hub.scheduler.jobs.deleted-projects-cleaner.period=1h
jeffrey.hub.scheduler.jobs.deleted-projects-cleaner.params.retention=7d

# Recomputes the storage overview (per-project disk usage shown on the Workspaces
# dashboard) into an in-memory cache. The scan walks every project repository, so the
# endpoint serves the cached snapshot; figures may be up to one period stale.
jeffrey.hub.scheduler.jobs.storage-overview-refresher.enabled=true
jeffrey.hub.scheduler.jobs.storage-overview-refresher.period=5m

# WORKSPACE — fan out across all workspaces
jeffrey.hub.scheduler.jobs.profiler-settings-synchronizer.enabled=true
jeffrey.hub.scheduler.jobs.profiler-settings-synchronizer.period=5m
jeffrey.hub.scheduler.jobs.profiler-settings-synchronizer.params.max-versions=5

# PROJECT — fan out across all projects in all workspaces
#
# Two independent retention rules per instance: an age window (duration + time-unit) and a
# cap of max-sessions logical sessions. A consecutive run of failed sessions (finished with
# zero bytes — a crash loop, collapsed in the UI) counts as ONE logical session; the live
# session occupies a slot; retained (pinned) sessions neither occupy a slot nor expire.
# Oldest logical sessions beyond the cap are deleted even before the age window expires.
jeffrey.hub.scheduler.jobs.project-instance-session-cleaner.enabled=true
jeffrey.hub.scheduler.jobs.project-instance-session-cleaner.period=1h
jeffrey.hub.scheduler.jobs.project-instance-session-cleaner.params.duration=7
jeffrey.hub.scheduler.jobs.project-instance-session-cleaner.params.time-unit=Days
jeffrey.hub.scheduler.jobs.project-instance-session-cleaner.params.max-sessions=10

jeffrey.hub.scheduler.jobs.project-instance-recording-cleaner.enabled=true
jeffrey.hub.scheduler.jobs.project-instance-recording-cleaner.period=1h
jeffrey.hub.scheduler.jobs.project-instance-recording-cleaner.params.duration=3
jeffrey.hub.scheduler.jobs.project-instance-recording-cleaner.params.time-unit=Days

# Bounds total disk per project. Age-based retention cannot cap disk usage on its own:
# a high-throughput service fills the volume long before anything reaches the windows
# above. Reclaims oldest-first — whole finished sessions, then finished chunks inside the
# live session. Retained sessions are never reclaimed. Accepts K/M/G/T (binary) or plain bytes.
jeffrey.hub.scheduler.jobs.project-storage-quota-cleaner.enabled=true
jeffrey.hub.scheduler.jobs.project-storage-quota-cleaner.period=15m
jeffrey.hub.scheduler.jobs.project-storage-quota-cleaner.params.max-size=20G

# Removes session directories that exist on disk but have no database row (a creation
# event dropped after exhausting its retries, or a crash before the event was published).
# The grace period must exceed the worst-case workspace-queue drain, otherwise a backlog
# looks the same as an orphan.

jeffrey.hub.scheduler.jobs.expired-instance-cleaner.enabled=true
jeffrey.hub.scheduler.jobs.expired-instance-cleaner.period=1h
jeffrey.hub.scheduler.jobs.expired-instance-cleaner.params.duration=14
jeffrey.hub.scheduler.jobs.expired-instance-cleaner.params.time-unit=Days

jeffrey.hub.scheduler.jobs.repository-jfr-compression.enabled=true
jeffrey.hub.scheduler.jobs.repository-jfr-compression.period=15m

jeffrey.hub.scheduler.jobs.session-finished-detector.enabled=true
jeffrey.hub.scheduler.jobs.session-finished-detector.period=30s

# Announces finished recording and artifact files as workspace events, so subscribers can react
# to each rotated chunk instead of waiting for the whole session.
#
# max-file-age is a correctness bound, not a tuning knob. The job is stateless and relies on the
# event queue's unique dedup index to swallow re-offered candidates, which only works while the
# dedup row still exists. It MUST therefore stay well below
# workspace-events-cleaner.params.queue-events-retention (31d) — once a file outlives its dedup
# row it is announced a second time, and retained (crash-pinned) sessions are never reclaimed at
# all. Startup logs an ERROR if the two ever cross.
#
# artifact-settle-threshold covers a gap the repository storage does not: the newest recording
# chunk of a live session is already marked ACTIVE while async-profiler writes it, but an artifact
# (a heap dump, say) has no such marker, so it must be seen untouched for this long first.
jeffrey.hub.scheduler.jobs.session-file-detector.enabled=true
jeffrey.hub.scheduler.jobs.session-file-detector.period=30s
jeffrey.hub.scheduler.jobs.session-file-detector.params.max-file-age=7d
jeffrey.hub.scheduler.jobs.session-file-detector.params.artifact-settle-threshold=10s
jeffrey.hub.scheduler.jobs.session-file-detector.params.max-events-per-tick=500
